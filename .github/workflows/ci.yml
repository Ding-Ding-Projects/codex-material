name: CI

# Codex Studio is a Windows-only Electron app, so there is exactly one runner and one
# platform here. Tests live in their own job so that "a failed test publishes no
# release" is enforced by `needs:` rather than by everyone remembering the rule.

on:
  push:
    # BRANCHES ONLY. A bare `push:` also fires on tag pushes, and the release job
    # below creates a tag — so every release triggered another run, which published
    # another release, which triggered another run. That loop produced 500+ releases
    # before it was caught. Never widen this without re-reading that sentence.
    branches:
      - "**"
    tags-ignore:
      - "**"
  workflow_dispatch:

# Every push gets its own run, and no run is ever stopped by a later one.
#
# The group was per-branch with cancel-in-progress: false, which sounds safe and is
# not: GitHub keeps at most ONE pending run per group, so a third push evicts the
# second while the first is still going. That is how build fa7975e was cancelled
# without anyone asking for it. The group is per-run now, which means it never
# matches another run and therefore never queues, evicts or cancels.
#
# The serialisation was protecting the dim sum code name, which was derived from a
# count of existing releases — two overlapping runs would read the same count and
# claim the same dish. The index comes from the run number instead: monotonic, unique
# per run, and unaffected by what any other run is doing.
#
# The run number is already in the hundreds, so the index is resolved against
# app/dimsum/roster.json — every dish the shared catalog names — rather than against
# the 72-dish photo slice the installer bundles. A build past the end of the photo
# slice is named without a picture; a build past the end of the roster ships unnamed
# and says why.
concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # vendor/codex is the upstream Codex CLI source. The app shells out to a
          # `codex` binary and never builds one, so cloning it costs minutes and buys
          # nothing.
          submodules: false

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # The tests only need the plain modules, so the Electron download is skipped
        # here and paid for once, in the release job.
        run: npm install --ignore-scripts

      - name: Frontend module tests
        run: node tools/test-frontend.mjs

      - name: Backend module tests
        run: node tools/test-backend.mjs

      - name: The bundled changelog matches the root copy
        run: node tools/sync-changelog.mjs --check

      - name: The landing page carries its own assets
        # GitHub Pages serves /docs and nothing above it, so a site asset that climbs
        # out of that tree works locally and 404s once published.
        run: node tools/sync-site-assets.mjs --check

      - name: Every file parses
        shell: pwsh
        run: |
          # A syntax error in a module the unit tests do not load never reaches them.
          # This catches the rest.
          $failed = @()
          Get-ChildItem -Path app, electron, tools -Recurse -Include *.js, *.mjs, *.cjs |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object {
              node --check $_.FullName 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) { $failed += $_.FullName }
            }
          if ($failed.Count -gt 0) {
            Write-Host "::error::Syntax errors in: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All JavaScript files parse."

  release:
    name: Build and release
    needs: test
    runs-on: windows-latest
    env:
      # Optional repo-scoped PAT first, then the organization token, then the
      # ephemeral workflow token. Never echoed, never written to a log.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          # Release notes need the previous tag and the commit range behind it.
          fetch-depth: 0

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # electron and electron-builder both need their postinstall scripts: one
        # downloads the Electron binary, the other selects a 7-Zip build.
        run: npm install --foreground-scripts

      - name: Resolve version and tag
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $version = $pkg.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Host "::error file=package.json::No version field found; refusing to publish a release we cannot name."
            exit 1
          }
          # run_number is monotonic per workflow and never reused. A re-run keeps the
          # same run_number, so run_attempt joins the suffix to keep the tag unique.
          $suffix = $env:GITHUB_RUN_NUMBER
          if ([int]$env:GITHUB_RUN_ATTEMPT -gt 1) {
            $suffix = "$($env:GITHUB_RUN_NUMBER).$($env:GITHUB_RUN_ATTEMPT)"
          }
          $tag = "v$version+build.$suffix"
          if (git tag --list $tag) {
            Write-Host "::error::Tag $tag already exists. Tags are immutable here; nothing was overwritten and no release was published."
            exit 1
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Write-Host "Release tag: $tag"

      - name: Resolve the dim sum code name
        id: dish
        shell: pwsh
        run: |
          # Derived from the monotonic run number, never claimed by writing a file back
          # to the branch — a release job that pushes to its own trigger is an infinite
          # loop. The tag reproduces the choice, so it stays auditable.
          #
          # This used to count the releases already carrying a `codex-studio-*.png`,
          # which is denser in the catalogue but reads shared state: two runs in flight
          # at once both see the same count and claim the same dish. That was only safe
          # while the concurrency group serialised runs — and that group was also
          # cancelling runs nobody asked it to cancel. The run number is unique per run
          # by construction, so overlapping builds cannot collide. The cost is that a
          # cancelled or re-run build skips a dish, which is a gap in a decorative
          # sequence rather than a fault.
          $index = [int]$env:GITHUB_RUN_NUMBER
          Write-Host "Build $index takes dish #$index."
          $json = node tools/release-codename.mjs --derive $index | ConvertFrom-Json
          $blank = @('assigned=false', 'photo=false', 'codeName=', 'slug=', 'asset=', 'alt=')
          if (-not $json.assigned) {
            # A code name is decoration with a purpose, not a gate. Ship anyway.
            Write-Host "::notice::No dim sum code name for this build: $($json.reason)"
            $blank | ForEach-Object { Add-Content -Path $env:GITHUB_OUTPUT -Value $_ }
            return
          }

          # The name is settled from here on. Everything below decides only whether a
          # photo travels with it, and a missing photo must never cost the build its
          # name: the roster names all 703 catalog dishes while the installer bundles a
          # 72-dish slice, so most builds are legitimately named without a picture.
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'assigned=true'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "codeName=$($json.codeName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "slug=$($json.slug)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "alt=$($json.altEn)"
          $noPhoto = @('photo=false', 'asset=')

          if (-not $json.bundledImage) {
            Write-Host "Code name: $($json.codeName) - named from the roster, photo not bundled."
            $noPhoto | ForEach-Object { Add-Content -Path $env:GITHUB_OUTPUT -Value $_ }
            return
          }
          $src = Join-Path 'app' $json.bundledImage
          if (-not (Test-Path $src)) {
            Write-Host "::warning::Code name $($json.codeName) names $src, which is missing; publishing the name without the photo."
            $noPhoto | ForEach-Object { Add-Content -Path $env:GITHUB_OUTPUT -Value $_ }
            return
          }

          # Validate that the image really decodes before publishing it as a release
          # asset. A truncated PNG that GitHub happily serves is worse than no photo.
          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Image]::FromFile((Resolve-Path $src))
          try {
            Write-Host "Code name: $($json.codeName) - $($img.Width)x$($img.Height) PNG decoded OK"
          } finally { $img.Dispose() }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $asset = "release-assets/codex-studio-$($json.slug).png"
          Copy-Item -LiteralPath $src -Destination $asset -Force

          Add-Content -Path $env:GITHUB_OUTPUT -Value 'photo=true'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "asset=$(Split-Path -Leaf $asset)"

      - name: Mirror the changelog into the frontend
        run: node tools/sync-changelog.mjs

      - name: Stage the bundled Codex CLI
        id: cli
        shell: pwsh
        run: |
          # ~410 MB unpacked. It ships so a machine that has never installed Codex is
          # useful the moment Studio is installed; the app still prefers the user's
          # own `codex` whenever one is on PATH.
          node tools/fetch-codex.mjs
          if (Test-Path vendor/codex-bin/bin/codex.exe) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'bundled=true'
          } else {
            Write-Host "::warning::No CLI staged; the installer will require the user to already have Codex installed."
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'bundled=false'
          }

      - name: Full smoke test
        # Runs here, not in the test job: that one installs with --ignore-scripts, so
        # the Electron binary is never downloaded there. This is also the right gate —
        # it drives the real preload, every command on the allow-list through the real
        # IPC channel, the real `codex` binary and all ten panels, and it fails the
        # build before an installer is cut. Unit tests passing is not the same claim as
        # the application working.
        run: node tools/smoke.mjs
        env:
          # The staging step above is allowed to decline, and an installer with no
          # bundled CLI is still usable by someone who already has Codex. Only that
          # case relaxes the CLI phase; every other failure still fails the build.
          CODEX_STUDIO_SMOKE_CLI_OPTIONAL: ${{ steps.cli.outputs.bundled == 'true' && '0' || '1' }}

      - name: Build the Windows installers
        run: npx electron-builder --win nsis msi --publish never

      - name: Verify the installers exist
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -Path dist -Filter *.exe -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem -Path dist -Filter *.msi -ErrorAction SilentlyContinue)
          if ($nsis.Count -eq 0) {
            Write-Host "::error::No NSIS installer in dist/. A release with no installer is a failed build, not a shipped one."
            exit 1
          }
          if ($msi.Count -eq 0) {
            Write-Host "::error::No MSI package in dist/. A release with no installer is a failed build, not a shipped one."
            exit 1
          }
          foreach ($f in ($nsis + $msi)) {
            $mb = [math]::Round($f.Length / 1MB, 1)
            Write-Host "Built $($f.Name) ($mb MB)"
          }

      - name: Write release notes
        shell: pwsh
        run: |
          $prev = git tag --list 'v*' --sort=-creatordate | Select-Object -First 1
          if ($prev) {
            $range = "$prev..HEAD"
            $prevLabel = "``$prev``"
          } else {
            $range = 'HEAD'
            $prevLabel = 'the start of the repository'
          }
          $lines = git log --no-merges --max-count=200 --pretty=format:'- %s (`%h`)' $range
          if (-not $lines) { $lines = '- No non-merge commits in this range.' }
          $commits = ($lines -join "`n")

          $bundled = '${{ steps.cli.outputs.bundled }}'
          if ($bundled -eq 'true') {
            $cliLine = 'The Codex CLI is **bundled** with this installer, so a machine that has never installed Codex works immediately. If you already have `codex` on your PATH, Studio uses yours — it owns your login and your `~/.codex`.'
          } else {
            $cliLine = 'This build does **not** bundle the Codex CLI. Install Codex separately, or Studio will report that it cannot run `codex`.'
          }

          # Built as an array rather than a here-string: a here-string terminator has
          # to sit at column 0, which a YAML block scalar cannot give us.
          $md = @(
            '## Codex Studio __VERSION__ - Windows',
            '',
            '|  |  |',
            '| --- | --- |',
            '| **Tag** | `__TAG__` |',
            '| **Commit** | [`__SHORT__`](__REPO__/commit/__SHA__) |',
            '| **Workflow run** | [run #__RUN_NUMBER__](__RUN_URL__) |',
            '| **Runner** | `windows-latest` (GitHub-hosted) |',
            '__CODENAME_BLOCK__',
            '',
            '### Installers',
            '',
            'Both attached files install the same build:',
            '',
            '- `*.exe` - NSIS installer, per-user install, no administrator rights needed.',
            '- `*.msi` - Windows Installer package, for managed or scripted deployment.',
            '',
            '__CLI_LINE__',
            '',
            '### What was checked before this release was published',
            '',
            'The release job runs only when the test job passes, so every check below was green in',
            '[run #__RUN_NUMBER__](__RUN_URL__) before this release existed:',
            '',
            '- `node tools/test-frontend.mjs`',
            '- `node tools/test-backend.mjs`',
            '- `node tools/sync-changelog.mjs --check`',
            '- every `.js`/`.mjs`/`.cjs` in `app/`, `electron/` and `tools/` parses',
            '',
            'Nothing beyond that has been verified. The installers are **not code-signed**, and this',
            'workflow does not install or launch them on a clean machine - SmartScreen will warn on',
            'first run, and you are trusting the commit above.',
            '',
            '### Changes since __PREV__',
            '',
            '__COMMITS__',
            '',
            '---',
            '',
            '呢個 build 出自 commit `__SHORT__`，run 喺上面條 link 度睇得返。上面幾個 check 全部綠晒先夠膽出呢個 release，',
            '除咗嗰幾個之外冇再驗過任何嘢：安裝檔**未簽名**，SmartScreen 第一次開會嘈，而且呢條 workflow 冇喺乾淨機試裝過。',
            '兩個檔案裝出嚟係同一個 build，`.exe` 唔使 admin，`.msi` 就啱公司批量部署。'
          )

          $sha = '${{ github.sha }}'
          $repo = '${{ github.server_url }}/${{ github.repository }}'
          $runUrl = "$repo/actions/runs/${{ github.run_id }}"

          $codeName = '${{ steps.dish.outputs.codeName }}'
          $asset = '${{ steps.dish.outputs.asset }}'
          $alt = '${{ steps.dish.outputs.alt }}'
          if ($codeName -and $asset) {
            $block = @(
              "| **Code name** | $codeName |",
              '',
              "![$alt]($repo/releases/download/${{ steps.ver.outputs.tag }}/$asset)",
              '',
              "This build's dim sum code name is **$codeName**, drawn from the project's bundled catalog.",
              "The photo above is attached to this release as ``$asset`` and is bundled with the app - it is",
              'never fetched from a third party. The version above is still what identifies this build.',
              '',
              "呢個 build 嘅點心代號係 **$codeName**，張相 (``$asset``) 一齊附喺呢個 release 度，係 app 自己帶住嘅本地檔，",
              '唔會去第三方攞。認 build 仲係睇上面個版本號，代號淨係方便大家傾偈嗌得出口。'
            ) -join "`n"
          } elseif ($codeName) {
            # Named from the roster, which covers the whole catalog, while only a slice
            # of the photos is bundled. Say so rather than leaving a reader wondering
            # where the picture went.
            $block = @(
              "| **Code name** | $codeName |",
              '',
              "This build's dim sum code name is **$codeName**, drawn from the project's bundled catalog.",
              'No photo is attached: the app bundles a curated slice of the dish photographs, and this',
              'one is outside it. The version above is still what identifies this build.',
              '',
              "呢個 build 嘅點心代號係 **$codeName**。今次冇附相 — app 淨係帶住部分菜式相，呢碟唔喺嗰批入面。",
              '認 build 仲係睇上面個版本號，代號淨係方便大家傾偈嗌得出口。'
            ) -join "`n"
          } else {
            $block = ''
          }

          $body = $md -join "`n"
          $body = $body.Replace('__VERSION__', '${{ steps.ver.outputs.version }}')
          $body = $body.Replace('__TAG__', '${{ steps.ver.outputs.tag }}')
          $body = $body.Replace('__SHORT__', $sha.Substring(0, 7))
          $body = $body.Replace('__SHA__', $sha)
          $body = $body.Replace('__REPO__', $repo)
          $body = $body.Replace('__RUN_NUMBER__', '${{ github.run_number }}')
          $body = $body.Replace('__RUN_URL__', $runUrl)
          $body = $body.Replace('__PREV__', $prevLabel)
          $body = $body.Replace('__COMMITS__', $commits)
          $body = $body.Replace('__CODENAME_BLOCK__', $block)
          $body = $body.Replace('__CLI_LINE__', $cliLine)

          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          Write-Host "Release notes written for range: $range"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ env.GH_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Codex Studio ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})${{ steps.dish.outputs.codeName && format(' · {0}', steps.dish.outputs.codeName) || '' }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          # The whole point of the release is the installers. No file, no release.
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.msi

      - name: Attach the dim sum photo
        # Separate from the installer upload on purpose: the installers are the reason
        # the release exists and must fail the job if missing, while a missing photo is
        # reported and does not block shipping.
        if: steps.dish.outputs.photo == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ env.GH_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          fail_on_unmatched_files: true
          files: release-assets/*.png
