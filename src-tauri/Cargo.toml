[package]
name = "codex-studio"
version = "0.1.0"
description = "Material 3 desktop GUI for the Codex CLI"
authors = ["Ding Ding Projects"]
repository = "https://github.com/Ding-Ding-Projects/codex-material"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "codex_studio"
path = "src/lib.rs"

[[bin]]
name = "codex-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
